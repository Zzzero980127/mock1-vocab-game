<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>一模單字遊樂場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 版面：上方記分列＋課次篩選，下方四張遊戲卡；進入遊戲後整個舞台換成遊戲畫面 */
:root{
  --bg:#eef1f8; --panel:#ffffff; --ink:#1a1d36; --muted:#646a8c; --line:#d8dcec;
  --hot:#ff6a1a; --cool:#0a9c95; --good:#1c9a52; --bad:#df3b4a; --soft:#fff1e8;
  --f-display:"Bungee","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11132a; --panel:#1b1e3c; --ink:#eef0ff; --muted:#9ca2cc; --line:#2e3360;
  --hot:#ff8a3d; --cool:#2fd0c6; --good:#3fcf7d; --bad:#ff6b78; --soft:#2a2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11132a; --panel:#1b1e3c; --ink:#eef0ff; --muted:#9ca2cc; --line:#2e3360;
  --hot:#ff8a3d; --cool:#2fd0c6; --good:#3fcf7d; --bad:#ff6b78; --soft:#2a2340; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body)}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font:400 clamp(26px,6vw,40px)/1 var(--f-display);margin:0;letter-spacing:.5px}
h1 span{color:var(--hot)}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{font:700 13px var(--f-mono);padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill b{color:var(--hot)}
.filters{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--f-mono);padding:5px 10px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cool);color:var(--ink);background:color-mix(in srgb,var(--cool) 16%,transparent)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.row label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.link{background:none;border:0;color:var(--bad);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.mode{all:unset;cursor:pointer;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.mode:hover,.mode:focus-visible{transform:translateY(-3px);border-color:var(--hot)}
.mode:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.mode .tag{font:400 22px/1 var(--f-display);color:var(--hot)}
.mode h3{margin:4px 0 0;font-size:18px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.mode .best{font:600 12px var(--f-mono);color:var(--cool);margin-top:auto;padding-top:6px}
.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:420px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:700 15px var(--f-body);padding:10px 18px;border-radius:12px;border:0;background:var(--hot);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
/* 配對 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;min-height:76px;padding:10px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:600;transition:transform .12s,opacity .3s,border-color .12s;word-break:break-word}
.tile.en{font-family:var(--f-mono)}
.tile:hover{border-color:var(--cool)}
.tile.sel{border-color:var(--hot);background:var(--soft)}
.tile.done{opacity:0;pointer-events:none;transform:scale(.8)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 快問 */
.q{font-size:clamp(22px,5vw,34px);font-weight:900;text-align:center;padding:18px 8px 4px;word-break:break-word}
.q.en{font-family:var(--f-mono)}
.q small{display:block;font:500 14px var(--f-mono);color:var(--muted)}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--cool);width:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:14px;border-radius:12px;border:2px solid var(--line);font-size:17px;font-weight:600;display:flex;gap:10px;align-items:center;word-break:break-word}
.opt kbd{font:700 12px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.opt.en{font-family:var(--f-mono)}
.opt:hover{border-color:var(--cool)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.combo{font:400 20px var(--f-display);color:var(--hot);text-align:center;min-height:26px}
/* 隕石 */
.arena{position:relative;height:340px;border-radius:14px;overflow:hidden;background:linear-gradient(var(--soft),transparent 70%),var(--bg);border:1.5px solid var(--line)}
.ground{position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,var(--hot) 0 14px,transparent 14px 28px)}
.rock{position:absolute;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:var(--panel);border:2px solid var(--hot);font-weight:900;font-size:20px;text-align:center;max-width:85%;box-shadow:0 6px 0 color-mix(in srgb,var(--hot) 40%,transparent)}
.rock small{display:block;font:500 12px var(--f-mono);color:var(--muted)}
.rock.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:translateX(-50%) scale(1.6);opacity:0}}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;font:600 20px var(--f-mono);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.type input:focus{outline:none;border-color:var(--cool)}
.msg{text-align:center;font-weight:700;min-height:26px}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.msg code{font:700 18px var(--f-mono);color:var(--hot)}
/* 拼字 */
.slots,.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.slot,.let{all:unset;box-sizing:border-box;width:42px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 22px var(--f-mono);cursor:pointer}
.slot{border-bottom:3px solid var(--line);background:var(--bg)}
.slot.fill{border-color:var(--cool)}
.slot.hint{color:var(--muted)}
.let{border:2px solid var(--line);background:var(--panel)}
.let:hover{border-color:var(--hot)}
.let.used{visibility:hidden}
.slots.ok .slot{border-color:var(--good);color:var(--good)}
/* 結算 */
.big{font:400 clamp(40px,10vw,64px)/1 var(--f-display);color:var(--hot);text-align:center}
.center{text-align:center;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td:first-child{font:700 15px var(--f-mono)}
th{color:var(--muted);font-weight:600;font-size:13px}
.say{all:unset;cursor:pointer;color:var(--cool);font-size:13px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>一模<span>單字</span>遊樂場</h1>
      <p class="sub">龍騰英文 I～II 課本單字（一模全科筆記），共 <span id="total"></span> 個</p>
    </div>
    <div class="stats">
      <span class="pill">Lv <b id="lv">1</b></span>
      <span class="pill">XP <b id="xp">0</b></span>
      <span class="pill">錯題 <b id="wc">0</b></span>
    </div>
  </header>

  <section class="filters" id="filters">
    <div class="chips" id="chips"></div>
    <div class="row">
      <label><input type="checkbox" id="wrongOnly"> 只練錯題本</label>
      <label><input type="checkbox" id="autoSay" checked> 答對自動唸單字</label>
      <span id="poolInfo"></span>
      <button class="link" id="clearWrong" type="button">清空錯題本</button>
    </div>
  </section>

  <section class="modes" id="menu">
    <button class="mode" data-m="match"><span class="tag">MATCH</span><h3>配對消除</h3><p>英文和中文配成一對，越快越好，配錯加罰 1 秒。</p><span class="best" id="best-match"></span></button>
    <button class="mode" data-m="quiz"><span class="tag">COMBO</span><h3>快問連擊</h3><p>15 題四選一、限時 10 秒，連續答對分數加倍。</p><span class="best" id="best-quiz"></span></button>
    <button class="mode" data-m="rock"><span class="tag">METEOR</span><h3>單字隕石</h3><p>中文隕石往下掉，打出英文擊碎它。掉到地上要抄一次答案。</p><span class="best" id="best-rock"></span></button>
    <button class="mode" data-m="spell"><span class="tag">SPELL</span><h3>拼字工坊</h3><p>看中文，用打亂的字母拼出單字，可用鍵盤直接打。</p><span class="best" id="best-spell"></span></button>
  </section>

  <section class="stage" id="stage" hidden></section>
</div>

  const set = pick(P, 6, ["w", "c"]);

    <div class="grid">${tiles.map((o, i) => `<button class="tile ${o.t}" data-i="${i}">${esc(o.s)}</button>`).join("")}</div>`);
  const t0 = performance.now(); let pen = 0, left = 6, sel = null; const missed = [];
  const iv = setInterval(() => $("#tm").textContent = ((performance.now() - t0) / 1000 + pen).toFixed(1), 100);
  stopFn = () => clearInterval(iv);
  stage.querySelector(".grid").onclick = e => {
    const b = e.target.closest(".tile"); if (!b) return;

    if (enQ) sayIf(x.w);
    const t0 = performance.now(), T = 10000;
    const tick = () => { const r = 1 - (performance.now() - t0) / T; $("#tbar").style.width = Math.max(0, r) * 100 + "%"; if (r <= 0) answer(-1, 0); else raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    $("#opts").onclick = e => { const b = e.target.closest(".opt"); if (b) answer(+b.dataset.k, 1 - (performance.now() - t0) / T); };
    function answer(k, r) {
      if (locked) return; locked = true; cancelAnimationFrame(raf);
      const btns = stage.querySelectorAll(".opt"), ok = k >= 0 && opts[k] === x;
      btns[opts.indexOf(x)].classList.add("ok");
      if (ok) {
        combo++; right++; hit(x); if (!enQ) sayIf(x.w);
        const mul = Math.min(3, 1 + Math.floor(combo / 3) * .5);
        score += Math.round((100 + r * 100) * mul);
        $("#cb").textContent = combo >= 3 ? `${combo} 連擊 ×${mul}` : "";
      } else {
        if (k >= 0) btns[k].classList.add("no");
        combo = 0; miss(x); missed.push(x); $("#cb").textContent = k < 0 ? "時間到" : "";
      }
      $("#sc").textContent = score; i++;
      setTimeout(next, ok ? 650 : 1500);
    }
  }
  next();
}

/* ---------- 單字隕石 ---------- */
function playRock(P) {
  let score = 0, lives = 3, combo = 0, n = 0, dur = 13000, raf = 0, cur = null, t0 = 0, copying = false, last = null; const missed = [];
  openStage(`${topBar("", `<span class="pill">生命 <b id="lf">♥♥♥</b></span><span class="pill">分數 <b id="sc">0</b></span><span class="pill">速度 <b id="spd">1</b></span>`)}
    <div class="arena" id="ar"><div class="ground"></div></div>
    <div class="msg" id="msg">打出英文後按 Enter</div>
    <form class="type" id="fm" autocomplete="off"><input id="in" placeholder="輸入英文單字" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">發射</button></form>`);
  const ar = $("#ar"), inp = $("#in"), msg = $("#msg");
  stopFn = () => cancelAnimationFrame(raf);
  const accept = x => new Set(W.filter(y => y.c === x.c && typable(y)).map(y => norm(y.w)));
  function spawn() {
    let x; do { x = P[Math.random() * P.length | 0]; } while (P.length > 1 && x === last);
    last = x; cur = { x, el: document.createElement("div") };
    cur.el.className = "rock"; cur.el.innerHTML = `${esc(x.c)}<small>${esc(pos(x))}・${x.l}</small>`;
    ar.append(cur.el); t0 = performance.now(); raf = requestAnimationFrame(fall);
  }
  function fall() {
    const r = (performance.now() - t0) / dur, h = ar.clientHeight - cur.el.offsetHeight - 10;
    cur.el.style.top = Math.min(r, 1) * h + "px";
    if (r >= 1) return land(); raf = requestAnimationFrame(fall);
  }
  function land() {
    lives--; combo = 0; miss(cur.x); missed.push(cur.x);
    $("#lf").textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
    sayIf(cur.x.w);
    if (lives <= 0) return end();
    copying = true; cur.el.style.borderColor = "var(--bad)";
    msg.className = "msg bad"; msg.innerHTML = `答案是 <code>${esc(cur.x.w)}</code>，抄一次再繼續`;
    inp.value = ""; inp.focus();
  }
  function end() {
    const best = !S.best.rock || score > S.best.rock; if (best) S.best.rock = score;
    result("rock", score, `擊碎 ${n} 顆隕石${best ? "・新紀錄！" : ""}`, missed, n * 3);
  }
  $("#fm").onsubmit = e => {
    e.preventDefault(); const v = norm(inp.value); if (!v || !cur) return;
    if (copying) {
      if (v === norm(cur.x.w)) { copying = false; cur.el.remove(); msg.className = "msg"; msg.textContent = "好，下一顆！"; inp.value = ""; spawn(); }
      else { inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); }
      return;
    }
    if (accept(cur.x).has(v)) {
      cancelAnimationFrame(raf); n++; combo++; hit(cur.x); sayIf(cur.x.w);
      score += 10 * Math.min(5, 1 + Math.floor(combo / 3));
      dur = Math.max(5000, dur - 350); $("#spd").textContent = Math.round(13000 / dur * 10) / 10;
      $("#sc").textContent = score; msg.className = "msg good"; msg.textContent = combo >= 3 ? `${combo} 連擊！` : "擊碎！";
      const el = cur.el; el.classList.add("boom"); setTimeout(() => el.remove(), 350);
      inp.value = ""; spawn();
    } else { msg.className = "msg bad"; msg.textContent = "不對，再試試"; inp.select(); }
  };
  inp.focus(); spawn();
}

/* ---------- 拼字工坊 ---------- */
function playSpell(P) {
  const qs = pick(P, Math.min(10, P.length), ["w"]);
  let i = 0, score = 0, right = 0; const missed = [];
  openStage(`${topBar("", `<span class="pill">題 <b id="qn">1</b>/${qs.length}</span><span class="pill">分數 <b id="sc">0</b></span>`)}
    <div class="q" id="q"></div><div class="slots" id="sl"></div><div class="letters" id="lt"></div>
    <div class="msg" id="msg"></div>
    <div class="bar" style="justify-content:center"><button class="btn ghost" id="hintB" type="button">提示一個字母（−10）</button><button class="btn ghost" id="skipB" type="button">看答案</button></div>`);
  let x, ans, letters, slots, hints, tries, done;
  function key(e) {
    if (done) return;
    if (e.key === "Backspace") { e.preventDefault(); undo(); return; }
    if (/^[a-z]$/i.test(e.key)) { const k = letters.findIndex((c, j) => !c.used && c.ch === e.key.toLowerCase()); if (k >= 0) put(k); }
  }
  document.addEventListener("keydown", key);
  stopFn = () => document.removeEventListener("keydown", key);
  function next() {
    if (i >= qs.length) {
      const best = !S.best.spell || score > S.best.spell; if (best) S.best.spell = score;
      return result("spell", score, `拼對 ${right}/${qs.length}${best ? "・新紀錄！" : ""}`, missed, right * 4);
    }
    x = qs[i]; ans = x.w.toLowerCase(); hints = 0; tries = 0; done = false;
    letters = shuffle([...ans]).map(ch => ({ ch, used: false }));
    slots = Array(ans.length).fill(null);
    $("#qn").textContent = i + 1;
    $("#q").innerHTML = `${esc(x.c)}<small>${esc(pos(x))}・${ans.length} 個字母</small>`;
    $("#msg").className = "msg"; $("#msg").textContent = "";
    draw();
  }
  function draw() {
    $("#sl").className = "slots";
    $("#sl").innerHTML = slots.map((s, j) => `<button class="slot ${s ? "fill" : ""} ${s && s.hint ? "hint" : ""}" data-j="${j}">${s ? s.ch : ""}</button>`).join("");
    $("#lt").innerHTML = letters.map((c, k) => `<button class="let ${c.used ? "used" : ""}" data-k="${k}">${c.ch}</button>`).join("");
  }
  function put(k) {
    const j = slots.indexOf(null); if (j < 0) return;
    letters[k].used = true; slots[j] = { ch: letters[k].ch, k }; draw();
    if (!slots.includes(null)) check();
  }
  function undo(j) {
    if (j === undefined) { for (j = slots.length - 1; j >= 0 && !(slots[j] && !slots[j].hint); j--); }
    if (j < 0 || !slots[j] || slots[j].hint) return;
    letters[slots[j].k].used = false; slots[j] = null; draw();
  }
  function check() {
    if (slots.map(s => s.ch).join("") === ans) {
      done = true; right++; const pts = Math.max(5, 30 - hints * 10 - tries * 5); score += pts;
      tries ? miss(x) : hit(x); if (tries) missed.push(x);
      $("#sc").textContent = score; $("#sl").classList.add("ok");
      $("#msg").className = "msg good"; $("#msg").textContent = `正確 +${pts}`; sayIf(x.w);
      i++; setTimeout(next, 900);
    } else {
      tries++; $("#msg").className = "msg bad"; $("#msg").textContent = "順序不對，點格子把字母拿回來";
      $("#sl").classList.remove("shake"); void $("#sl").offsetWidth; $("#sl").classList.add("shake");
    }
  }
  $("#lt").onclick = e => { const b = e.target.closest(".let"); if (b && !done) put(+b.dataset.k); };
  $("#sl").onclick = e => { const b = e.target.closest(".slot"); if (b && !done) undo(+b.dataset.j); };
  $("#hintB").onclick = () => {
    if (done) return;
    // 把錯位的字母全部收回，填入下一個正確字母
    slots.forEach((s, j) => { if (s && !s.hint && s.ch !== ans[j]) { letters[s.k].used = false; slots[j] = null; } });
    const j = slots.findIndex((s, j) => !s || s.ch !== ans[j]); if (j < 0) return;
    if (slots[j]) { letters[slots[j].k].used = false; }
    const k = letters.findIndex(c => !c.used && c.ch === ans[j]);
    letters[k].used = true; slots[j] = { ch: ans[j], k, hint: true }; hints++; draw();
    if (!slots.includes(null)) check();
  };
  $("#skipB").onclick = () => {
    if (done) return; done = true; miss(x); missed.push(x);
    $("#msg").className = "msg bad"; $("#msg").innerHTML = `答案是 <code>${esc(x.w)}</code>`; speak(x.w);
    i++; setTimeout(next, 1800);
  };
  next();
}

$("#total").textContent = W.length;
renderChips(); hud();
</script>
