<!doctype html>
<html lang="zh-Hant" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>英文遊樂場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
/* 版面：上方玩家列＋分頁，下方依分頁換內容；進入遊戲後整個舞台換成遊戲畫面 */
:root{
  --bg:#eef1f8; --panel:#ffffff; --ink:#1a1d36; --muted:#646a8c; --line:#d8dcec;
  --hot:#ff6a1a; --cool:#0a9c95; --good:#1c9a52; --bad:#df3b4a; --soft:#fff1e8; --gold:#d99a00; --gem:#7a4dff;
  --f-display:"Bungee","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11132a; --panel:#1b1e3c; --ink:#eef0ff; --muted:#9ca2cc; --line:#2e3360;
  --hot:#ff8a3d; --cool:#2fd0c6; --good:#3fcf7d; --bad:#ff6b78; --soft:#2a2340; --gold:#ffc83d; --gem:#b49bff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11132a; --panel:#1b1e3c; --ink:#eef0ff; --muted:#9ca2cc; --line:#2e3360;
  --hot:#ff8a3d; --cool:#2fd0c6; --good:#3fcf7d; --bad:#ff6b78; --soft:#2a2340; --gold:#ffc83d; --gem:#b49bff; color-scheme:dark}
/* 商店造型（固定配色，不跟系統深淺色） */
:root[data-skin]{--gem:#b49bff}
:root[data-skin="sakura"],:root[data-skin="forest"]{--gem:#7a4dff}
:root[data-skin="galaxy"]{--bg:#0d0b24;--panel:#1a1640;--ink:#f1edff;--muted:#a69ccc;--line:#2f2866;--hot:#b18cff;--cool:#6be3ff;--good:#6bf0a0;--bad:#ff6b8a;--soft:#251e55;--gold:#ffd36b;--gem:#ff9de2;color-scheme:dark}
:root[data-skin="galaxy"] body{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 80px,#ffe9a8,transparent),radial-gradient(1px 1px at 200px 160px,#fff,transparent),radial-gradient(1px 1px at 60px 210px,#cfc4ff,transparent);background-size:240px 240px;animation:starDrift 60s linear infinite}
:root[data-skin="galaxy"] body::before,:root[data-skin="galaxy"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1}
:root[data-skin="galaxy"] body::before{background-image:radial-gradient(2px 2px at 50px 70px,#fff,transparent),radial-gradient(2.5px 2.5px at 170px 40px,#ffe9a8,transparent),radial-gradient(2px 2px at 110px 190px,#9fe8ff,transparent),radial-gradient(2px 2px at 230px 130px,#fff,transparent);background-size:290px 260px;animation:twinkle 2.6s ease-in-out infinite alternate}
:root[data-skin="galaxy"] body::after{background-image:radial-gradient(1.5px 1.5px at 80px 150px,#fff,transparent),radial-gradient(2px 2px at 190px 90px,#ffb8f0,transparent),radial-gradient(1.5px 1.5px at 30px 20px,#fff,transparent);background-size:210px 230px;animation:twinkle 3.7s ease-in-out -1.5s infinite alternate}
@keyframes twinkle{0%{opacity:.15}100%{opacity:1}}
@keyframes starDrift{to{background-position:240px 240px}}
:root[data-skin="lava"]{--bg:#1a0b07;--panel:#2a120b;--ink:#ffeee5;--muted:#c79a86;--line:#4a2214;--hot:#ff5a1f;--cool:#ffc23d;--good:#8be06b;--bad:#ff4d4d;--soft:#3a170c;--gold:#ffc23d;--gem:#ff8fd0;color-scheme:dark}
:root[data-skin="lava"] body{background-image:radial-gradient(ellipse at 50% 120%,rgba(255,90,31,.35),transparent 60%);background-attachment:fixed}
:root[data-skin="lava"] body::before,:root[data-skin="lava"] body::after{content:"";position:fixed;left:0;right:0;pointer-events:none;z-index:-1}
:root[data-skin="lava"] body::before{bottom:0;height:55%;background:radial-gradient(ellipse at 30% 110%,rgba(255,90,31,.6),transparent 60%),radial-gradient(ellipse at 75% 115%,rgba(255,194,61,.45),transparent 55%);animation:lavaPulse 3.2s ease-in-out infinite alternate}
:root[data-skin="lava"] body::after{top:0;bottom:0;background-image:radial-gradient(2px 2px at 40px 60px,#ffb347,transparent),radial-gradient(2.5px 2.5px at 150px 20px,#ff7a2f,transparent),radial-gradient(1.5px 1.5px at 100px 140px,#ffd36b,transparent),radial-gradient(2px 2px at 210px 100px,#ff5a1f,transparent);background-size:250px 300px;animation:embers 9s linear infinite}
@keyframes lavaPulse{0%{opacity:.45;transform:scaleY(.9)}100%{opacity:1;transform:scaleY(1.15)}}
@keyframes embers{to{background-position:30px -300px}}
@media (prefers-reduced-motion:reduce){:root[data-skin] body,:root[data-skin] body::before,:root[data-skin] body::after{animation:none!important}}
:root[data-skin="aurora"]{--bg:#06141f;--panel:#0d2230;--ink:#e8fff8;--muted:#8fb8b0;--line:#1b3b4a;--hot:#3df5b0;--cool:#8a7dff;--good:#3df5b0;--bad:#ff6b8a;--soft:#11303f;--gold:#ffe07a;--gem:#c7a6ff;color-scheme:dark}
#auroraCv{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
:root[data-skin="ocean"]{--bg:#0b2236;--panel:#10324d;--ink:#e6f6ff;--muted:#8fb6cc;--line:#1d4a6b;--hot:#ffb02e;--cool:#4fd1ff;--good:#4ade80;--bad:#ff6b6b;--soft:#13405f;--gold:#ffd54a;color-scheme:dark}
:root[data-skin="sakura"]{--bg:#fff4f7;--panel:#ffffff;--ink:#3a1f2b;--muted:#9a6b7c;--line:#f3d3de;--hot:#e8487a;--cool:#7c6cf0;--good:#1f9d55;--bad:#d93a4a;--soft:#ffe4ec;--gold:#c98a00;color-scheme:light}
:root[data-skin="forest"]{--bg:#eef5ea;--panel:#fbfdf8;--ink:#1f2a1c;--muted:#61705b;--line:#d3e2cb;--hot:#d9822b;--cool:#2f8f4e;--good:#2f8f4e;--bad:#c9443b;--soft:#f6ecd9;--gold:#b88400;color-scheme:light}
:root[data-skin="neon"]{--bg:#0a0716;--panel:#15102b;--ink:#f4ecff;--muted:#a497c9;--line:#2c2250;--hot:#ff3fa4;--cool:#2ff3e0;--good:#5dff9b;--bad:#ff5470;--soft:#23143d;--gold:#ffe14d;color-scheme:dark}
:root[data-skin="gold"]{--bg:#121110;--panel:#1d1b18;--ink:#f5efe2;--muted:#a59c88;--line:#36322a;--hot:#e8b64c;--cool:#7fc8a9;--good:#7fd99b;--bad:#ff7a6b;--soft:#2a251b;--gold:#ffd166;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body)}
[hidden]{display:none!important}
button{font-family:inherit}
.wrap{max-width:860px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
h1{font:400 clamp(26px,6vw,40px)/1 var(--f-display);margin:0;letter-spacing:.5px}
h1 span{color:var(--hot)}
h2{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font:700 13px var(--f-mono);padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--hot)}
.pill.coin b{color:var(--gold)}
.pill.gem b{color:var(--gem)}
.btn.gemb{background:var(--gem)}
.loginwrap{position:relative}
.lmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:230px;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);box-shadow:0 8px 24px #0006}
.lmenu[hidden],.loginwrap[hidden]{display:none}
.lmenu button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;font-weight:700;font-size:14px;background:var(--bg,#0002)}
.lmenu button:hover{outline:2px solid var(--hot)}
.lmenu small{color:var(--muted);font-size:11px;line-height:1.4}
.me{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.me:focus-visible{outline:3px solid var(--cool)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--soft);flex:none}
.av.lg{width:64px;height:64px;font-size:38px}
.me .nm{font-weight:700;font-size:14px;line-height:1.2}
.me .tt{font-size:11px;color:var(--muted)}
.xpbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold))}
.xpline{display:flex;flex-direction:column;gap:4px;font:600 12px var(--f-mono);color:var(--muted)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
nav button{flex:none;font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;position:relative}
nav button[aria-selected="true"]{border-color:var(--hot);color:var(--ink);background:var(--soft)}
nav button .dot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--f-mono);padding:5px 10px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cool);color:var(--ink);background:color-mix(in srgb,var(--cool) 16%,transparent)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.row label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.link{background:none;border:0;color:var(--bad);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.mode{all:unset;cursor:pointer;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s;position:relative}
.mode:hover,.mode:focus-visible{transform:translateY(-3px);border-color:var(--hot)}
.mode:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.mode .tag{font:400 22px/1 var(--f-display);color:var(--hot)}
.mode h3{margin:4px 0 0;font-size:18px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.mode .best{font:600 12px var(--f-mono);color:var(--cool);margin-top:auto;padding-top:6px}
.mode.locked{opacity:.75}
.mode.locked .best{color:var(--gold)}
.stage{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:420px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:700 15px var(--f-body);padding:10px 18px;border-radius:12px;border:0;background:var(--hot);color:#fff;cursor:pointer}
.btn.small{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.green{background:var(--good)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
/* 配對 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;min-height:76px;padding:10px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;font-size:16px;font-weight:600;transition:transform .12s,opacity .3s,border-color .12s;word-break:break-word}
.tile.en{font-family:var(--f-mono)}
.tile:hover{border-color:var(--cool)}
.tile.sel{border-color:var(--hot);background:var(--soft)}
.tile.done{opacity:0;pointer-events:none;transform:scale(.8)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* 快問 */
.q{font-size:clamp(22px,5vw,34px);font-weight:900;text-align:center;padding:18px 8px 4px;word-break:break-word}
.q.en{font-family:var(--f-mono)}
.q small{display:block;font:500 14px var(--f-mono);color:var(--muted)}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--cool);width:100%}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;padding:14px;border-radius:12px;border:2px solid var(--line);font-size:17px;font-weight:600;display:flex;gap:10px;align-items:center;word-break:break-word}
.btn kbd{font:700 11px var(--f-mono);border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:4px;opacity:.7}
.opt kbd{font:700 12px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.opt.en{font-family:var(--f-mono)}
.opt:hover{border-color:var(--cool)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent)}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.combo{font:400 20px var(--f-display);color:var(--hot);text-align:center;min-height:26px}
.vsboard{display:flex;flex-direction:column;gap:5px}
.vsrow{display:grid;grid-template-columns:20px minmax(70px,1.2fr) 2fr 56px;gap:8px;align-items:center;font-size:13px;font-weight:700}
.vsrow.me{color:var(--hot)} .vsrow .rk{font:400 14px var(--f-display);text-align:center} .vsrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .vsrow .sc{text-align:right;font-variant-numeric:tabular-nums}
.rsearch{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:24;display:flex;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.rsearch[hidden]{display:none}
.rsearch .field{width:120px;flex:none;font-size:15px;padding:7px 10px}
.vsbar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;font-size:14px;font-weight:700}
.vsbar .side{display:flex;flex-direction:column;gap:4px}
.vsbar .side:last-child{text-align:right}
.vsbar .vs{font:400 18px var(--f-display);color:var(--hot)}
/* 隕石 */
.arena{position:relative;height:340px;border-radius:14px;overflow:hidden;background:linear-gradient(var(--soft),transparent 70%),var(--bg);border:1.5px solid var(--line)}
.ground{position:absolute;left:0;right:0;bottom:0;height:10px;background:repeating-linear-gradient(90deg,var(--hot) 0 14px,transparent 14px 28px)}
.rock{position:absolute;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:14px;background:var(--panel);border:2px solid var(--hot);font-weight:900;font-size:20px;text-align:center;max-width:85%;box-shadow:0 6px 0 color-mix(in srgb,var(--hot) 40%,transparent)}
.rock small{display:block;font:500 12px var(--f-mono);color:var(--muted)}
.rock.boom{animation:boom .35s forwards}
@keyframes boom{to{transform:translateX(-50%) scale(1.6);opacity:0}}
.type{display:flex;gap:8px}
.type input,.field{flex:1;min-width:0;font:600 20px var(--f-mono);padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.field{font:600 16px var(--f-body)}
.type input:focus,.field:focus{outline:none;border-color:var(--cool)}
.msg{text-align:center;font-weight:700;min-height:26px}
.msg.bad{color:var(--bad)} .msg.good{color:var(--good)}
.msg code{font:700 18px var(--f-mono);color:var(--hot)}
/* 拼字 */
.slots,.letters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.slot,.let{all:unset;box-sizing:border-box;width:42px;height:50px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 22px var(--f-mono);cursor:pointer}
.slot{border-bottom:3px solid var(--line);background:var(--bg)}
.slot.fill{border-color:var(--cool)}
.slot.hint{color:var(--muted)}
.let{border:2px solid var(--line);background:var(--panel)}
.let:hover{border-color:var(--hot)}
.let.used{visibility:hidden}
.slots.ok .slot{border-color:var(--good);color:var(--good)}
/* 結算 */
.big{font:400 clamp(40px,10vw,64px)/1 var(--f-display);color:var(--hot);text-align:center}
.center{text-align:center;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
.words td:first-child{font:700 15px var(--f-mono)}
.say{all:unset;cursor:pointer;color:var(--cool);font-size:13px;font-weight:700}
/* 商店 */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--panel)}
.item.on{border-color:var(--cool)}
.item .ico{font-size:30px;line-height:1}
.item .swatch{display:flex;gap:3px}
.item .swatch i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
.item b{font-size:15px}
.item small{color:var(--muted);font-size:12px}
.price{font:700 13px var(--f-mono);color:var(--gold)}
/* 好友／排行 */
.list{display:flex;flex-direction:column}
.person{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .info{flex:1;min-width:0}
.person .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .info small{color:var(--muted);font-size:12px}
.rank{width:32px;text-align:center;font:400 18px var(--f-display);color:var(--muted);flex:none}
.rank.r1{color:var(--gold)} .rank.r2{color:var(--muted)} .rank.r3{color:var(--hot)}
.score{font:700 16px var(--f-mono);font-variant-numeric:tabular-nums}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--muted);opacity:.5}
.status.on{color:var(--good)} .status.on i{background:var(--good);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.person.me-row{background:var(--soft);border-radius:10px}
.code{font:700 22px var(--f-mono);letter-spacing:3px;color:var(--hot)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.cl{padding:8px 0;border-bottom:1px solid var(--line)}
.cl:last-child{border-bottom:0}
.cl .v{font:700 15px var(--f-mono);color:var(--hot)}
.cl ul{margin:6px 0 0;padding-left:20px;font-size:14px}
.new{margin-left:8px;font-size:11px;font-weight:700;color:#fff;background:var(--hot);border-radius:6px;padding:1px 6px}
.muted{color:var(--muted);font-size:14px}
/* 成就 */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ach{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;opacity:.78}
.ach.got{opacity:1;border-color:var(--tc)}
.ach .trophy{font-size:24px;line-height:1}
.ach:not(.got) .trophy{filter:grayscale(1)}
.ach .tier{font-size:11px;font-weight:700;color:var(--tc);border:1px solid var(--tc);border-radius:6px;padding:0 6px}
.ach small{color:var(--muted);font-size:12px}
.ach small.ok{color:var(--good);font-weight:700}
.plate{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:6px 8px}
.plate .av{width:28px;height:28px;font-size:16px}
.plate b{display:block;font-size:13px;line-height:1.2}
.plate small{color:var(--tc)!important;font-weight:700}
.achpop{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:26;display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);cursor:pointer;animation:drop .4s;max-width:calc(100% - 32px)}
.achpop .trophy{font-size:30px}
.achpop small{display:block;font-size:12px;color:var(--muted)}
.achpop b{display:block;font-size:16px}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
/* 史詩／傳說成就特效 */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes rot{to{--a:360deg}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slam{0%{transform:scale(3.2) rotate(-25deg);opacity:0}60%{transform:scale(.9) rotate(4deg);opacity:1}100%{transform:scale(1)}}
@keyframes shine{to{background-position:300% 0}}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(0);opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 14px #ff3fa4,0 0 4px #ffd76b}}
.fx{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle,rgba(20,10,40,.85),rgba(0,0,0,.92));overflow:hidden;padding:16px;color:#fff}
.fx .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--tc) 45%,transparent) 0 8deg,transparent 8deg 22deg);animation:spin 14s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 45%);mask-image:radial-gradient(circle,#000 0,transparent 45%)}
.fx .core{position:relative;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:420px}
.fx .core>*:not(.big-trophy){animation:rise .5s both;animation-delay:.6s}
.fx .big-trophy{font-size:110px;line-height:1;filter:drop-shadow(0 0 28px var(--tc)) drop-shadow(0 0 8px #fff);animation:slam .75s cubic-bezier(.2,1.4,.4,1) both}
.fx .tierlbl{font:400 26px var(--f-display);letter-spacing:6px;color:var(--tc);text-shadow:0 0 20px var(--tc)}
.fx h2{font-size:32px;margin:0}
.fx .spark{position:absolute;left:50%;top:50%;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);opacity:0;animation:burst 1.3s ease-out both}
.shine{background:linear-gradient(90deg,#ffd76b,#fff7d6,#ff8a3d,#ff3fa4,#b18cff,#6be3ff,#ffd76b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.5s linear infinite;font-weight:900}
.dev-glow{filter:drop-shadow(0 0 6px rgba(255,200,80,.55))}
.devbadge{display:inline-block;margin-left:6px;font:400 10px/1 var(--f-display);letter-spacing:1px;color:#fff;background:linear-gradient(90deg,#ff3fa4,#ff8a3d);border-radius:5px;padding:3px 5px;vertical-align:middle;animation:pulse 2s ease-in-out infinite}
.me.dev{border:2px solid transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--a),#ffd76b,#ff3fa4,#6be3ff,#b18cff,#ffd76b) border-box;animation:rot 4s linear infinite}
.ach.got.epic{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--a),var(--tc),transparent 25%,var(--tc) 50%,transparent 75%,var(--tc)) border-box;animation:rot 5s linear infinite;box-shadow:0 0 18px color-mix(in srgb,var(--tc) 30%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--panel);border-radius:18px;padding:24px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .35s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.invite{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--panel);border:2px solid var(--hot);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(420px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="notranslate" translate="no">
<div class="wrap">
  <header>
    <div>
      <h1><span>英文</span>遊樂場</h1>
    </div>
    <div class="stats">
      <button class="me" id="meBtn" type="button"><span class="av" id="meAv"></span><span><span class="nm" id="meName"></span><br><span class="tt" id="meTitle"></span></span></button>
      <span class="pill coin">金幣 <b id="coins">0</b></span>
      <span class="pill gem">寶石 <b id="gems">0</b></span>
      <div class="loginwrap" id="loginWrap" hidden><button class="btn small" id="loginBtn" type="button">登入 ▾</button>
        <div class="lmenu" id="loginMenu" hidden><button type="button" data-lg="google">用 Google 登入</button><button type="button" data-lg="guest">遊客登入</button>
          <small>遊客不用綁定任何帳號，也能加好友、對戰。之後可以再綁定 Google 保存進度。</small></div></div>
    </div>
  </header>
  <div class="xpline"><div class="row" style="justify-content:space-between;font-size:12px"><span>Lv <b id="lv">1</b>・XP <span id="xp">0</span></span><span id="xpNext"></span></div><div class="xpbar"><i id="xpFill"></i></div></div>

  <nav id="nav" role="tablist">
    <button role="tab" data-tab="games" aria-selected="true">遊戲</button>
    <button role="tab" data-tab="vs">對戰</button>
    <button role="tab" data-tab="rank">排行榜</button>
    <button role="tab" data-tab="ach">成就</button>
    <button role="tab" data-tab="shop">商店</button>
    <button role="tab" data-tab="me">個人資料</button>
    <button role="tab" data-tab="log" id="logTab">更新日誌</button>
  </nav>

  <section id="tab-games" class="tab">
    <div style="display:flex;flex-direction:column;gap:14px" id="gamesHome">
      <div class="card" id="filters">
        <div class="chips" id="chips"></div>
        <div class="row">
          <label><input type="checkbox" id="wrongOnly"> 只練錯題本（<span id="wc">0</span>）</label>
          <label><input type="checkbox" id="autoSay" checked> 出題自動唸英文</label>
          <label><input type="checkbox" id="sfx" checked> 音效</label>
          <label>題數 <select id="nq"><option value="0">標準</option><option value="5">5</option><option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="50">50</option></select></label>
          <span id="poolInfo"></span>
          <button class="link" id="clearWrong" type="button">清空錯題本</button>
        </div>
      </div>
      <div class="modes" id="menu"></div>
    </div>
    <section class="stage" id="stage" hidden></section>
  </section>

  <section id="tab-vs" class="tab" hidden><div id="vsBox" style="display:flex;flex-direction:column;gap:14px"></div></section>
  <section id="tab-rank" class="tab" hidden><div id="rankBox" style="display:flex;flex-direction:column;gap:14px"></div></section>
  <section id="tab-ach" class="tab" hidden><div id="achBox" style="display:flex;flex-direction:column;gap:14px"></div></section>
  <section id="tab-shop" class="tab" hidden><div id="shopBox" style="display:flex;flex-direction:column;gap:14px"></div></section>
  <section id="tab-me" class="tab" hidden><div id="meBox" style="display:flex;flex-direction:column;gap:14px"></div></section>
  <section id="tab-log" class="tab" hidden><div class="card"><h2>更新日誌</h2><div id="clList"></div></div></section>
</div>
